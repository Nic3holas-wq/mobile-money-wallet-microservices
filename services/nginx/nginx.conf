# ---------- Access log format (JSON) ----------
# $uri is logged instead of $request_uri so query strings (tokens, personal data) never reach the log
log_format json_combined escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"duration":$request_time,"bytes":$body_bytes_sent,'
  '"upstream_status":"$upstream_status"}';

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log json_combined;

    return 301 https://$host$request_uri;
}

# ---------- API gateway (HTTPS on 443) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    access_log /var/log/nginx/access.log json_combined;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Short max-age while developing, so a mistake doesn't stick in your browser
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Shared proxy settings, inherited by every location below.
    # X-Forwarded-For and X-Request-Id are overwritten, so client-sent values are discarded.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-Id      $request_id;
    proxy_connect_timeout 3s;

    # Default body limit for everything
    client_max_body_size 1m;

    # KYC uploads: larger body, longer timeout (placeholder path: use your real one)
    location /api/v1/customers/me/kyc-documents {
        client_max_body_size 6m;
        proxy_read_timeout 30s;
        proxy_pass http://gateway:8080;
    }

    location / {
        proxy_read_timeout 15s;
        proxy_pass http://gateway:8080;
    }
}

# ---------- Keycloak (HTTPS on 8443) ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    access_log /var/log/nginx/access.log json_combined;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Keycloak sends large cookies and headers
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}