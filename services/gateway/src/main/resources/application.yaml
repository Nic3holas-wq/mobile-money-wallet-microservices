server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  reactor:
    context-propagation: auto

  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000        # ms to open a connection
            response-timeout: 10s        # default max wait for a response
          routes:
            - id: customer-kyc-upload
              uri: http://customer-service:8081
              predicates:
                - Path=/api/v1/customers/me/kyc-profile/documents/
                - Method=POST
              metadata:
                response-timeout: 30000
              filters:
                - name: RequestSize
                  args:
                    maxSize: 6MB
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
            # Docs route: gateway /customer-service/v3/api-docs -> customer-service /v3/api-docs
            - id: customer-service-docs
              uri: http://customer-service:8081
              predicates:
                - Path=/customer-service/v3/api-docs/**
              metadata:
                connect-timeout: 2000
                response-timeout: 5000   # ms, overrides the global value for this route
              filters:
                - StripPrefix=1

            # Business API route
            - id: customer-service
              uri: http://customer-service:8081
              predicates:
                - Path=/api/v1/customers/**,/api/v1/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: customer-service
                    fallbackUri: forward:/fallback/customer-service
                    statusCodes: 502,503,504
            # Wallet docs: gateway /wallet-service/v3/api-docs -> wallet-service /v3/api-docs
            - id: wallet-service-docs
              uri: http://wallet-service:8082
              predicates:
                - Path=/wallet-service/v3/api-docs/**
              metadata:
                connect-timeout: 2000
                response-timeout: 5000
              filters:
                - StripPrefix=1

            # Money-moving operations: stricter rate limit, no retries
            - id: wallet-service-transfers
              uri: http://wallet-service:8082
              predicates:
                - Path=/api/v1/wallets/*/transfers/**,/api/v1/transfers/**, /api/v1/admin/transfers/**
              metadata:
                response-timeout: 15000
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

            # General wallet API
            - id: wallet-service
              uri: http://wallet-service:8082
              predicates:
                - Path=/api/v1/wallets/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: wallet-service
                    fallbackUri: forward:/fallback/wallet-service
                    statusCodes: 502,503,504

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/mobile-money-wallet/protocol/openid-connect/certs

app:
  rate-limit:
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:0}
  security:
    admin-role: ${CUSTOMER_ADMIN_ROLE:customer-admin}
    issuer-uri: ${GATEWAY_ISSUER_URI:http://localhost:9091/realms/mobile-money-wallet}
    jwk-set-uri: ${GATEWAY_JWK_SET_URI:http://keycloak:8080/realms/mobile-money-wallet/protocol/openid-connect/certs}
    allowed-audiences: ${GATEWAY_ALLOWED_AUDIENCES:customer-service, wallet-service}

springdoc:
  swagger-ui:
    urls:
      - name: customer-service
        url: /customer-service/v3/api-docs
      - name: wallet-service
        url: /wallet-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO