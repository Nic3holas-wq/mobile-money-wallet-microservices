services:
  postgresql:
    container_name: mw_pg_sql
    image: postgres:16
    environment:
      POSTGRES_USER: nicko
      POSTGRES_PASSWORD: nicko
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro,Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nicko -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5436:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: mw_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5051:80"
    networks:
      - microservices-net
    restart: unless-stopped

  zipkin:
    container_name: mw_zipkin
    image: openzipkin/zipkin
    ports:
      - "9412:9411"
    networks:
      - microservices-net

  redis:
    image: redis:8-alpine
    container_name: mw_redis
    ports:
      - "6381:6379"
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: mw_kafka
    ports:
      - "9093:9092"
    environment:
      # Single-node KRaft cluster for local development.
      CLUSTER_ID: 9sHjMTddTnSxKtoYHVKbFg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - microservices-net

  mail-dev:
    container_name: mw_mail_dev
    image: maildev/maildev
    ports:
      - 1081:1080
      - 1026:1025

  keycloak-postgres:
    container_name: keycloak-postgres-mw
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  keycloak:
    container_name: keycloak-mw
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - "9091:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
    depends_on:
      - keycloak-postgres
    networks:
      - microservices-net
    command:
      - start-dev
    restart: unless-stopped

volumes:
  postgres:
  pgadmin:
  keycloak_postgres_data:

networks:
  microservices-net:
