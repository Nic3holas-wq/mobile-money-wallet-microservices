services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mw_nginx
    ports:
      - "81:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
    depends_on:
      - gateway
      - keycloak
    networks:
      - microservices-net
    restart: unless-stopped

  customer-service:
    container_name: customer-service
    build:
      context: ./customer
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      CUSTOMER_DB_HOST: postgresql
      CUSTOMER_DB_PORT: 5432
      CUSTOMER_DB_NAME: customer_db
      CUSTOMER_DB_USERNAME: nicko
      CUSTOMER_DB_PASSWORD: nicko

      KEYCLOAK_ISSUER_URI: https://localhost:8443/realms/mobile-money-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mobile-money-wallet/protocol/openid-connect/certs
      CUSTOMER_JWT_AUDIENCE: customer-service
      CUSTOMER_DOCUMENT_ENCRYPTION_KEY: ${CUSTOMER_DOCUMENT_ENCRYPTION_KEY:-}
      CUSTOMER_DOCUMENT_HASH_KEY: ${CUSTOMER_DOCUMENT_HASH_KEY:-}
      CUSTOMER_VERIFICATION_HMAC_KEY: ${CUSTOMER_VERIFICATION_HMAC_KEY:-}
      SPRING_MAIL_HOST: mail-dev
      SPRING_MAIL_PORT: 1025
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: mobile-money-wallet
      KEYCLOAK_REGISTRATION_CLIENT_ID: ${KEYCLOAK_REGISTRATION_CLIENT_ID:-wallet-registration-service}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:-}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: customer-service
      KAFKA_ENABLED: "true"

    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
      mail-dev:
        condition: service_started

    networks:
      - microservices-net

    restart: unless-stopped

  wallet-service:
    container_name: wallet-service
    build:
      context: ./wallet
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082

      WALLET_DB_HOST: postgresql
      WALLET_DB_PORT: 5432
      WALLET_DB_NAME: wallet_db
      WALLET_DB_USERNAME: nicko
      WALLET_DB_PASSWORD: nicko

      KEYCLOAK_ISSUER_URI: https://localhost:8443/realms/mobile-money-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mobile-money-wallet/protocol/openid-connect/certs
      WALLET_JWT_AUDIENCE: wallet-service

      # Feign client -> customer service (container DNS, internal port)
      CLIENTS_CUSTOMER_URL: http://customer-service:8081

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: wallet-service
      KAFKA_ENABLED: "true"
      WALLET_STEPUP_HMAC_KEY: ${WALLET_STEPUP_HMAC_KEY:-}

    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
      customer-service:
        condition: service_started

    networks:
      - microservices-net

    restart: unless-stopped

  payment-service:
    container_name: payment-service
    build:
      context: ./payment
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8083
      PAYMENT_DB_HOST: postgresql
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_NAME: payment_db
      PAYMENT_DB_USERNAME: nicko
      PAYMENT_DB_PASSWORD: nicko
      KEYCLOAK_ISSUER_URI: https://localhost:8443/realms/mobile-money-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mobile-money-wallet/protocol/openid-connect/certs
      PAYMENT_JWT_AUDIENCE: payment-service
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: mobile-money-wallet
      PAYMENT_WALLET_CLIENT_ID: ${PAYMENT_WALLET_CLIENT_ID:-payment-service}
      PAYMENT_WALLET_CLIENT_SECRET: ${PAYMENT_WALLET_CLIENT_SECRET:-}
      CLIENTS_WALLET_URL: http://wallet-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: payment-service
      KAFKA_ENABLED: "true"
      MPESA_BASE_URL: ${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_BUSINESS_SHORT_CODE: ${MPESA_BUSINESS_SHORT_CODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      MPESA_PUBLIC_BASE_URL: ${MPESA_PUBLIC_BASE_URL:-}
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-}
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC:-payment.events.v1}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
      wallet-service:
        condition: service_started
    networks:
      - microservices-net
    restart: unless-stopped

  gateway:
    container_name: api-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile

    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_TRUSTED_PROXIES: 1
      GATEWAY_ISSUER_URI: https://localhost:8443/realms/mobile-money-wallet

    expose:
      - "8080"

    depends_on:
      keycloak:
        condition: service_started
      customer-service:
        condition: service_started
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy

    networks:
      - microservices-net

    restart: unless-stopped

  postgresql:
    container_name: mw_pg_sql
    image: postgres:16
    environment:
      POSTGRES_USER: nicko
      POSTGRES_PASSWORD: nicko
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nicko -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5436:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  database-bootstrap:
    image: postgres:16
    environment:
      PGPASSWORD: nicko
    entrypoint: ["/bin/sh", "/bootstrap/ensure-databases.sh"]
    volumes:
      - ./postgres-init:/bootstrap:ro,Z
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - microservices-net
    restart: "no"

  pgadmin:
    container_name: mw_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5051:80"
    networks:
      - microservices-net
    restart: unless-stopped

  zipkin:
    container_name: mw_zipkin
    image: openzipkin/zipkin
    ports:
      - "9412:9411"
    networks:
      - microservices-net

  redis:
    image: redis:8-alpine
    container_name: mw_redis
    ports:
      - "6381:6379"
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: mw_kafka
    ports:
      - "9093:9092"
    environment:
      # Single-node KRaft cluster for local development.
      CLUSTER_ID: 9sHjMTddTnSxKtoYHVKbFg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - microservices-net

  mail-dev:
    container_name: mw_mail_dev
    image: maildev/maildev
    ports:
      - 1081:1080
      - 1026:1025
    networks:
      - microservices-net

  keycloak-postgres:
    container_name: keycloak-postgres-mw
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  keycloak:
    container_name: keycloak-mw
    image: quay.io/keycloak/keycloak:24.0.2
    expose:
      - "8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: https://localhost:8443
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on:
      - keycloak-postgres
    networks:
      - microservices-net
    command:
      - start-dev
    restart: unless-stopped

volumes:
  postgres:
  pgadmin:
  keycloak_postgres_data:

networks:
  microservices-net:
