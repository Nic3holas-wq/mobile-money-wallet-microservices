spring:
  application:
    name: customer-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://${CUSTOMER_DB_HOST:localhost}:${CUSTOMER_DB_PORT:5436}/${CUSTOMER_DB_NAME:customer_db}
    username: ${CUSTOMER_DB_USERNAME:nicko}
    password: ${CUSTOMER_DB_PASSWORD:nicko}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: customer-service-pool
      maximum-pool-size: ${CUSTOMER_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${CUSTOMER_JWT_AUDIENCE:customer-service}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9091/realms/mobile-money-wallet}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:customer-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.verapay.customer.event"
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    root: INFO
    com.verapay.customer: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}

    topics:
      customer-registered: customer.registered.v1
      customer-activated: customer.activated.v1
      customer-suspended: customer.suspended.v1
      kyc-submitted: customer.kyc.submitted.v1
      kyc-verified: customer.kyc.verified.v1
