spring:
  application:
    name: customer-service

  cloud:
    config:
      enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://${CUSTOMER_DB_HOST:postgresql}:${CUSTOMER_DB_PORT:5432}/${CUSTOMER_DB_NAME:customer_db}
    username: ${CUSTOMER_DB_USERNAME:nicko}
    password: ${CUSTOMER_DB_PASSWORD:nicko}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: customer-service-pool
      maximum-pool-size: ${CUSTOMER_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${CUSTOMER_JWT_AUDIENCE:customer-service}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9091/realms/mobile-money-wallet}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/mobile-money-wallet/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:customer-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.nicko.customer.event"

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}] [requestId:%X{requestId:-none}]"

  level:
    root: INFO
    com.nicko.customer: INFO
    com.nicko.customer.logging: ${CUSTOMER_LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  security:
    admin-role: ${CUSTOMER_ADMIN_ROLE:customer-admin}

  kyc:
    document-encryption-key: ${CUSTOMER_DOCUMENT_ENCRYPTION_KEY:}
    document-hash-key: ${CUSTOMER_DOCUMENT_HASH_KEY:}

  kafka:
    enabled: ${KAFKA_ENABLED:true}

    topics:
      customer-registered: customer.registered.v1
      customer-activated: customer.activated.v1
      customer-suspended: customer.suspended.v1
      kyc-submitted: customer.kyc.submitted.v1
      kyc-verified: customer.kyc.verified.v1

  onboarding:
    minimum-age: ${CUSTOMER_MINIMUM_AGE:18}

  consent:
    terms-version: ${CUSTOMER_TERMS_VERSION:v1}
    privacy-version: ${CUSTOMER_PRIVACY_VERSION:v1}
    marketing-version: ${CUSTOMER_MARKETING_VERSION:v1}

  verification:
    hmac-key: ${CUSTOMER_VERIFICATION_HMAC_KEY:}
    sms-inbox: ${CUSTOMER_SMS_TEST_INBOX:.local/customer-sms}